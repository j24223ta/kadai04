<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>演習課題5-1：カウンタ</title>
</head>
<body>
  <h1>0</h1>
  <button>カウント</button>
  <p id="counter-display">0</p>

  <button id="counter-btn">カウント</button>

  <script>
    const number = document.querySelentor('h1');
    const plusButton = document.querySelector('button');

    let count = 0;
    plusButton.addEventListener("click",() => {
      count++;
      number.innerHTML = count;
    });
  </script>
  
</body>
</html>
